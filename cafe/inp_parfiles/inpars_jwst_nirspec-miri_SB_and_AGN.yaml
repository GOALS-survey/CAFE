# Converted from inpars_jwst_nirspec-miri_SB_and_AGN.ini

METADATA:
  OBJECT:
    description: "This section is default empty, and is filled in when fit results are written out. Records all the inputs when the fit is run, the time, and the location of the outputs/logfile for the run."
    value: ""
  INPARS:
    value: ""
  Z:
    value: ""
  RUNOPTS:
    value: ""
  TIME:
    value: ""
  OUTDIR:
    value: ""
  LOGFILE:
    value: ""
  RA:
    value: ""
  DEC:
    value: ""
  XSPAXEL:
    value: ""
  YSPAXEL:
    value: ""

"COMPONENT SOURCE SEDs":
  SOURCE_CIR:
    description: "These are the SEDs used as the heating sources for each dust component. In other words, the radiation field SEDs listed here illuminate and heat the indicated dust component. Options for source SEDs are: 'ISRF', 'AGN', 'SB2MYR', 'SB10MYR', and 'SB100MYR' (the latter of which are SB99 models). Changing this parameter will likely have a near-negligible impact on most dust emission SEDs but the option to change the heating SED is provided for completeness and to allow experimentation in various situations."
    value: "ISRF"
  SOURCE_CLD:
    value: "ISRF"
  SOURCE_COO:
    value: "ISRF"
  SOURCE_WRM:
    value: "ISRF"
  SOURCE_HOT:
    value: "ISRF"

"MODULES & TABLES":
  RESOLUTIONS:
    value: ["g395h", "miri_ch1s", "miri_ch1m", "miri_ch1l", "miri_ch2s", "miri_ch2m", "miri_ch2l", "miri_ch3s", "miri_ch3m", "miri_ch3l", "miri_ch4s", "miri_ch4m", "miri_ch4l"]
  ATOMIC_INPUT:
    description: "Initial values and properties of emission lines are obtained from the files available in the 'tables' directory"
    value: "lines.atomic_SB_and_AGN.txt"
  MOLECULAR_INPUT:
    value: "lines.molecular_SB_and_AGN.txt"
  HRECOMB_INPUT:
    value: "lines.H_recombination_SB_and_AGN.txt"
  PAH_INPUT:
    value: "pah_template.txt"
  GOPACITIES_INPUT:
    value: "gauss_opacity.ecsv"

"PAH & LINE OPTIONS":
  FITWAVE0_PAH:
    description: "Settings that control the fitting of the PAH complexes and emission lines. Initial values of the properties of PAH features are defined and obtained from the 'jam_pahdrude.pro' routine. Let the central wavelengths of PAHs vary during the fit?"
    value: false
  FITGAMMA_PAH:
    description: "Let the widths of PAH features vary during the fit?"
    value: false
  FITWAVE0_LIN_N:
    description: "Let the central wavelengths of lines vary during the fit?"
    value: false
  FITWAVE0_LIN_B:
    value: true
  FITGAMMA_LIN_N:
    description: "Let the widths of emission lines vary during the fit?"
    value: false
  FITGAMMA_LIN_B:
    value: true
  FITWAVE0_OPC:
    value: false
  FITGAMMA_OPC:
    value: true
  FITVGRAD:
    description: "Velocity shift applied to all non-continuum components, mimicking a rotation gradient."
    value: true
  EPSWAVE0_PAH:
    description: "The following all set how much each of the parameters is allowed to fractionally vary. A value of -1 indicates that a parameter is allowed to vary freely from its initial value. PAHs Wave0 -> +/- [km/s]"
    value: 500.0
  EPSGAMMA_PAH:
    description: "FWHM -> 0.2D = +/- 20% ; relative quantity"
    value: 0.2
  EPSPEAK_PAH:
    description: "Peak PAH flux densities range freely by default."
    value: -1.0
  EPSWAVE0_LIN_N:
    description: "Lines Wave0 -> +/- [km/s]"
    value: 100.0
  EPSWAVE0_LIN_B:
    value: 500.0
  EPSGAMMA_LIN_N:
    description: "FWHM -> max(EPSGamma_LIN_N/B + [km/s], 1.05*resolution(lambda)) / minimum is set to resolution."
    value: 400.0
  EPSGAMMA_LIN_B:
    value: 2000.0
  EPSPEAK_LIN:
    description: "Peak line flux densities range freely by default."
    value: -1.0
  EPSWAVE0_OPC:
    description: "Absorption features"
    value: 500.0
  EPSGAMMA_OPC:
    value: 0.2
  EPSPEAK_OPC:
    value: 1.0
  EPSVGRAD:
    description: "Velocity gradient. Note that if FitVgrad = True, then EPSWave0_LIN_N, EPSWave0_PAH and EPSWave0_OPC must be >= EPSVgrad"
    value: 150.0

"CONTINUA INITIAL VALUES AND OPTIONS":

  # "CIRRUS" DUST COMPONENT
  CIR_FLX:
    description: "CIR dust component initial flux ratio @Wave_CIR (see above)."
    value: 0.0
    vary: false
    bounds: [0.0, 2.0]
  CIR_TMP:
    value: 3.74
    vary: false
    bounds: [0.0, .inf]

  # "COLD" DUST COMPONENT
  CLD_FLX:
    description: "-----------------------------------------------------------------------------# CLD dust component initial flux ratio @Wave_CLD."
    value: 0.0
