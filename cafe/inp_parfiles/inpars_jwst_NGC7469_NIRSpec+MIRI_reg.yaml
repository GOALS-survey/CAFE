# Converted from inpars_jwst_NGC7469_NIRSpec+MIRI_reg.ini

METADATA:
  OBJECT:
    description: "This section is default empty, and is filled in when fit results are written out. Records all the inputs when the fit is run, the time, and the location of the outputs/logfile for the run."
    value: ""
  INPARS:
    value: ""
  Z:
    value: ""
  RUNOPTS:
    value: ""
  TIME:
    value: ""
  OUTDIR:
    value: ""
  LOGFILE:
    value: ""
  RA:
    value: ""
  DEC:
    value: ""
  XSPAXEL:
    value: ""
  YSPAXEL:
    value: ""

"COMPONENT SOURCE SEDs":
  SOURCE_CIR:
    description: "These are the SEDs used as the heating sources for each dust component. In other words, the radiation field SEDs listed here illuminate and heat the indicated dust component. Options for source SEDs are: 'ISRF', 'AGN', 'SB2MYR', 'SB10MYR', and 'SB100MYR' (the latter of which are SB99 models). Changing this parameter will likely have a near-negligible impact on most dust emission SEDs but the option to change the heating SED is provided for completeness and to allow experimentation in various situations."
    value: "ISRF"
  SOURCE_CLD:
    value: "ISRF"
  SOURCE_COO:
    value: "ISRF"
  SOURCE_WRM:
    value: "ISRF"
  SOURCE_HOT:
    value: "AGN"

SWITCHES:
  ONION:
    description: "Assume that the CLD, COO, WRN, HOT dust components are nested in concentric shells. When this option is activated, it enforces TAU_HOT > TAU_WRM > TAU_COO"
    value: false
  ORION_H2O:
    description: "Use Orion template for 3um H20 feature"
    value: false
  ERRSPEC:
    description: "Add a constant fractional uncertainty to spec data"
    value: 0.02

"MODULES & TABLES":
  RESOLUTIONS:
    value: ["JWST_NIRSpec_G395H", "JWST_MIRI_CH1S", "JWST_MIRI_CH1M", "JWST_MIRI_CH1L", "JWST_MIRI_CH2S", "JWST_MIRI_CH2M", "JWST_MIRI_CH2L", "JWST_MIRI_CH3S", "JWST_MIRI_CH3M", "JWST_MIRI_CH3L", "JWST_MIRI_CH4S", "JWST_MIRI_CH4M", "JWST_MIRI_CH4L"]
  ATOMIC_INPUT:
    value: "lines.atomic_jwst.txt"
  MOLECULAR_INPUT:
    value: "lines.molecular.txt"
  HRECOMB_INPUT:
    value: "lines.H_recombination.txt"

"PAH & LINE OPTIONS":
  FITWAVE0_PAH:
    description: "Settings that control the fitting of the PAH complexes and emission lines. Initial values of the properties of PAH features are defined and obtained from the 'jam_pahdrude.pro' routine. Initial values and properties of the atomic and molecular emission lines are obtained from the files 'lines.atomic.txt' and 'lines.molecular.txt', respectively (available in the 'tables' directory Let the central wavelengths of PAHs vary during the fit?"
    value: false
  FITGAMMA_PAH:
    description: "Let the widths of PAH features vary during the fit?"
    value: false
  FITWAVE0_LIN_N:
    description: "Let the central wavelengths of lines vary during the fit?"
    value: false
  FITWAVE0_LIN_B:
    value: false
  FITGAMMA_LIN_N:
    description: "Let the widths of emission lines vary during the fit?"
    value: false
  FITGAMMA_LIN_B:
    value: false
  EPSWAVE0_PAH:
    description: "The following all set how much each of the parameters is allowed to fractionally vary. A value of -1 indicates that a parameter is allowed to vary freely from its initial value. Wave0 -> +/- [km/s]"
    value: 400.0
  EPSGAMMA_PAH:
    description: "FWHM -> 0.2D = +/- 20% ; relative quantity / minimum is set to resolution."
    value: 0.2
  EPSPEAK_PAH:
    description: "Peak PAH flux densities range freely by default."
    value: -1.0
  EPSWAVE0_LIN_N:
    description: "Wave0 -> +/- [km/s]"
    value: 200.0
  EPSWAVE0_LIN_B:
    value: 500.0
  EPSGAMMA_LIN_N:
    description: "FWHM -> max(EPSGamma_LIN_N/B + [km/s], 1.05*resolution(lambda))"
    value: 400.0
  EPSGAMMA_LIN_B:
    value: 2000.0
  EPSPEAK_LIN:
    description: "Peak line flux densities range freely by default."
    value: -1.0

